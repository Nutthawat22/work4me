[pytest]
minversion = 6.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v -ra --strict-markers --strict-config
console_output_style = classic
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning